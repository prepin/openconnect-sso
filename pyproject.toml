[project]
name = "openconnect-sso"
version = "0.8.1"
description = "Wrapper script for OpenConnect supporting Azure AD (SAMLv2) authentication to Cisco SSL-VPNs"
license = "GPL-3.0-only"
authors = [{ name = "László Vaskó", email = "laszlo.vasko@outlook.com" }]
readme = "README.md"
requires-python = ">=3.11,<3.15"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Networking",
]
dependencies = [
    "attrs>=18.2",
    "lxml>=5,<7",
    "keyring>=21.1",
    "prompt-toolkit>=3.0.3,<4",
    "pyxdg>=0.26",
    "requests>=2.22,<3",
    "structlog>=20.1",
    "toml>=0.10,<0.11",
    "PySocks>=1.7.1,<2",
    "PyQt6>=6.3,<7",
    "PyQt6-WebEngine>=6.3,<7",
    "pyotp>=2.7,<3",
]

[project.urls]
Homepage = "https://github.com/prepin/openconnect-sso"
Repository = "https://github.com/prepin/openconnect-sso"

[project.scripts]
openconnect-sso = "openconnect_sso.cli:main"

[dependency-groups]
dev = [
    "coverage_enable_subprocess>=1,<2",
    "pytest>=8,<10",
    "black==22.10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=4,<8",
    "pytest-httpserver>=1,<2",
    "pre-commit>=4,<5",
]

[tool.black]
target-version = ["py311"]

[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"
