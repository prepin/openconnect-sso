name: Coding Style

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - '**'

jobs:
  tests:
    name: Coding Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v9
        with:
          version: '0.12.18'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pre-commit run --all-files
